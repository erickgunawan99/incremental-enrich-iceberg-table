services:
  # MinIO
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - iceberg-enrich

  # MinIO bucket initialization
  minio-client:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/transaction --ignore-existing;
      /usr/bin/mc mb myminio/quarantine --ignore-existing;
      /usr/bin/mc mb myminio/dimension --ignore-existing;
      /usr/bin/mc mb myminio/audit-logs --ignore-existing;
      echo 'Buckets created successfully';
      exit 0;
      "
    networks:
      - iceberg-enrich
    
  # Spark Master
  spark-master:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: spark-master
    hostname: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
    ports:
      - "8080:8080"  # Spark Master Web UI
      - "7077:7077"  # Spark Master port
    volumes:
      - ./spark_include:/opt/spark-jobs
      - ./spark-logs:/opt/spark-logs
      - ./spark-events:/opt/spark-events
    command: >
      bash -c "/opt/spark/sbin/start-master.sh &&
      tail -f /opt/spark/logs/spark--org.apache.spark.deploy.master.Master-1-*.out"
    networks:
      - iceberg-enrich

  # Spark Worker 1
  spark-worker-1:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: spark-worker-1
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_WEBUI_PORT=8081
    ports:
      - "8081:8081"  # Worker 1 Web UI
    volumes:
      - ./spark_include:/opt/spark-jobs
      - ./spark-logs:/opt/spark-logs
      - ./spark-events:/opt/spark-events
    command: >
      bash -c "/opt/spark/sbin/start-worker.sh spark://spark-master:7077 &&
      tail -f /opt/spark/logs/spark--org.apache.spark.deploy.worker.Worker-1-*.out"
    networks:
      - iceberg-enrich
  spark-history-server:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: spark-history-server
    depends_on:
      - spark-master
    environment:
      - SPARK_HISTORY_OPTS= "-Dspark.history.fs.logDirectory=file:///opt/spark-events"
    ports:
      - "18080:18080"    # Spark History Server UI
    volumes:
      - ./spark-events:/opt/spark-events:ro  # share same event logs as master
    command: >
      bash -c "/opt/spark/sbin/start-history-server.sh &&
      tail -f /dev/null"
    networks:
      - iceberg-enrich
  # Airflow with SQLite (simplified, no postgres needed)
  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    command: >
      bash -c "airflow db migrate &&
               airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true"
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - airflow-db:/opt/airflow
    networks:
      - iceberg-enrich

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    command: webserver
    ports:
      - "8888:8080"
      - "4040:4040"      # ✅ Spark Driver UI (client mode)
      - "4041:4041"  
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_ENDPOINT_URL=http://minio:9000
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - airflow-db:/opt/airflow
      - /var/run/docker.sock:/var/run/docker.sock
      - ./spark-events:/opt/spark-events
    user: "50000:0"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      minio:
        condition: service_started
      spark-master:
        condition: service_started
    networks:
      - iceberg-enrich

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    command: scheduler
    ports:
      - "4043:4040"      # ✅ If scheduler also runs Spark jobs
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_ENDPOINT_URL=http://minio:9000
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - airflow-db:/opt/airflow
      - /var/run/docker.sock:/var/run/docker.sock
      - ./spark-events:/opt/spark-events
    user: "50000:${DOCKER_GID:-999}"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      minio:
        condition: service_started
      spark-master:
        condition: service_started
    networks:
      - iceberg-enrich

networks:
  iceberg-enrich:
    driver: bridge

volumes:
  minio-data:
  airflow-db:
  spark-events: